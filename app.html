<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <title>בוט חברת חשמל</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <!-- מודל התראות פנימי (מחליף את הודעות הדפדפן) -->
  <div id="customModal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <h4 id="modalTitle">כותרת</h4>
      <p id="modalMessage">הודעה</p>
      <div id="modalInputContainer" style="display: none;">
          <input type="text" id="modalInput" placeholder="...">
      </div>
      <div class="modal-actions">
        <button id="modalCancelBtn" class="btn secondary-btn btn-sm">ביטול</button>
        <button id="modalConfirmBtn" class="btn primary-btn btn-sm">אישור</button>
      </div>
    </div>
  </div>

  <!-- באנר עדכונים -->
  <div id="updateBanner" class="update-banner" style="display: none;">
    <span>🚀 עדכון חדש זמין!</span>
    <button id="downloadUpdateBtn" class="btn-text">הורד עכשיו</button>
  </div>

  <div class="header">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
    </div>
    <h2>מערכת דיווח חכמה</h2>
    
    <div class="nav-actions">
      <button id="openSidePanelBtn" title="פתח בפאנל צד" class="icon-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="15" y1="3" x2="15" y2="21"></line></svg>
      </button>
      <button id="openOptionsBtn" title="פתח במסך מלא" class="icon-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      </button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="reportTab">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
      דיווח
    </button>
    <button class="tab-btn" data-tab="accountsTab">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      חשבונות
    </button>
    <button class="tab-btn" data-tab="settingsTab">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      הגדרות
    </button>
  </div>

  <!-- 1. מסך הדיווח -->
  <div id="reportTab" class="tab-content active">
    <div class="card bg-light-orange">
      <div class="form-group" style="margin-bottom:6px;">
        <label>בחר חשבון לדיווח:</label>
        <select id="accountSelect"><option value="">טוען...</option></select>
      </div>
      <div id="lastReportInfo" class="last-report-info"></div>

      <div class="form-group">
        <label>מצב מונה נוכחי:</label>
        <input type="number" id="meterInput" placeholder="לדוגמה: 45612">
      </div>
      
      <div class="checkbox-row">
        <div class="checkbox-group" title="מייד כשהוא מנסה להתחבר, הוא ייצא מהחשבון המחובר כעת">
          <input type="checkbox" id="forceLogout">
          <label for="forceLogout">התנתק קודם</label>
        </div>
        <div class="checkbox-group" title="ירוץ עד הסוף ויישאר פתוח ללא שליחה בפועל">
          <input type="checkbox" id="testMode" checked>
          <label for="testMode">מצב אישור ידני</label>
        </div>
      </div>
      
      <div style="display: flex; gap: 10px;">
        <button id="startBtn" class="btn primary-btn" style="flex: 1;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"></path><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          התחל אוטומציה
        </button>
        <button id="stopBtn" class="btn" style="flex: 1; display: none; background: #D34300; color: white;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><rect x="9" y="9" width="6" height="6" fill="currentColor"></rect></svg>
          עצור ריצה
        </button>
      </div>
    </div>

    <div class="card log-container dark-mode" id="logWrapper">
      <div class="log-header">
        <span class="log-title">סטטוס התקדמות חי</span>
        <button id="toggleThemeBtn" class="theme-btn" title="שנה רקע יומן">
          <!-- האייקון יוזרק כאן דינמית -->
        </button>
      </div>
      <div id="logArea"></div>
    </div>
  </div>

  <!-- 2. מסך החשבונות -->
  <div id="accountsTab" class="tab-content">
    <div id="accountsList"></div>
    
    <div class="card bg-light-orange" id="accountFormCard">
      <h3 id="accountFormTitle">הוספת חשבון חדש</h3>
      <div class="form-group">
        <input type="text" id="newAccName" placeholder="שם מזהה (למשל: בית)">
      </div>
      <div class="form-group">
        <input type="text" id="newAccTz" placeholder="תעודת זהות / ח.פ">
      </div>
      <div class="form-group">
        <label>קישור Google Apps Script אישי לחשבון (אופציונלי):</label>
        <input type="url" id="newAccGas" placeholder="https://script.google.com/...">
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="newAccSuffix" checked>
        <label for="newAccSuffix">הוסף אוטומטית סיומת <code>?action=getIecOtp</code> לחשבון זה</label>
      </div>
      
      <div style="display: flex; gap: 8px; margin-top: 15px;">
          <button id="addAccBtn" class="btn secondary-btn" style="flex: 2;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            שמור חשבון
          </button>
          <button id="cancelEditBtn" class="btn secondary-btn" style="flex: 1; display: none; color: var(--text-muted); border-color: var(--border);">ביטול עריכה</button>
      </div>
    </div>
  </div>

  <!-- 3. מסך הגדרות -->
  <div id="settingsTab" class="tab-content">
    <div class="card bg-light-orange">
      <h3>הגדרות מערכת כלליות</h3>
      
      <div class="checkbox-group" style="margin-bottom: 20px;">
        <input type="checkbox" id="globalMuteNotifications">
        <label for="globalMuteNotifications">השתק את כל ההתראות במערכת (יגבר על הגדרות חשבון)</label>
      </div>

      <div class="form-group">
        <label>קישור GAS כללי (ברירת מחדל אם לא הוגדר לחשבון):</label>
        <input type="url" id="gasUrlInput" placeholder="https://script.google.com/macros/s/...">
      </div>
      
      <div class="checkbox-group">
        <input type="checkbox" id="globalAutoSuffix" checked>
        <label for="globalAutoSuffix">הוסף אוטומטית סיומת <code>?action=getIecOtp</code> לקישור הכללי</label>
      </div>

      <button id="saveSettingsBtn" class="btn primary-btn" style="margin-top:15px; margin-bottom:15px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        שמור הגדרות כלליות
      </button>
      
      <div style="display: flex; gap: 10px;">
        <button id="exportLogsBtn" class="btn secondary-btn" style="flex: 1;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          הורד יומן
        </button>
        <button id="clearLogsBtn" class="btn secondary-btn" style="flex: 1; border-color: var(--error); color: var(--error);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          נקה יומן
        </button>
      </div>
    </div>

    <!-- כרטיסיית גרסה שניתנת ללחיצה -->
    <div class="card version-card bg-light-orange" id="versionCardBtn" title="לחץ לבדיקת עדכונים ידנית">
      <div class="v-details">
        <h3 style="margin-bottom:0;">גרסת תוכנה</h3>
      </div>
      <span class="v-badge" id="currentVersionBadge">טוען...</span>
    </div>
    <div id="settingsStatus" class="status-msg"></div>

    <!-- זכויות יוצרים מעוצב -->
    <div class="card credits-card bg-light-orange">
      <p style="font-size: 16px; margin: 0 0 4px 0; color: var(--text-main);">&copy;</p>
      <p style="margin: 0 0 12px 0;">כל הזכויות שמורות</p>
      
      <div class="credits-links">
        <a href="https://github.com/Tzadikvtovlo" target="_blank">צדיק וטוב לו</a>
        <a href="https://github.com/Tzadikvtovlo/MyReportingBot" target="_blank">נהנית? תן כוכב! ⭐</a>
        <a href="#" id="copyEmailBtn" title="לחץ להעתקת המייל">q9411aa@gmail.com <span id="copyEmailMsg" class="copy-msg">הועתק!</span></a>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
